<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fake News Related Headlines</title>
</head>
<body>
    <h1>Fake News Related Headlines</h1>
    <textarea id="newsInput" rows="6" cols="60" placeholder="Enter news text here..."></textarea><br>
    <button onclick="fetchHeadlines()">Get Related Headlines</button>
    <div id="results"></div>
    <script>
        async function fetchHeadlines() {
            const newsText = document.getElementById('newsInput').value;
            document.getElementById('results').innerHTML = "Loading...";
            const response = await fetch('/get_headlines', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({news: newsText})
            });
            const data = await response.json();
            if (data.error) {
                document.getElementById('results').innerHTML = "Error: " + data.error;
            } else {
                let html = "<h3>Related Google News Headlines:</h3><ul>";
                data.headlines.forEach(headline => {
                    html += `<li>${headline}</li>`;
                });
                html += "</ul>";
                document.getElementById('results').innerHTML = html;
            }
        }
    </script>
</body>
</html>
